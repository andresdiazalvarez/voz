<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#bf4b09" />
    <title>Edificios</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icon.svg" alt="" />
        <span>Edificios</span>
      </div>
    </header>

    <main>
      <section id="clientsView">
        <h1>Clientes</h1>
        <div id="clientsList" class="clientsList"></div>
        <form id="newClientForm" class="clientCard">
          <h3>Nuevo cliente</h3>
          <label>Nombre del cliente<input id="newClientName" required maxlength="150" /></label>
          <label>Datos 1<textarea id="newClientData1" rows="2"></textarea></label>
          <label>Datos 2<textarea id="newClientData2" rows="2"></textarea></label>
          <button type="submit" class="primary">Crear cliente</button>
        </form>
      </section>
      <section id="homeView" class="hero hidden">
        <button class="back" data-back="clients">← Clientes</button>
        <p class="kicker">EDIFICIOS</p>
        <h1 id="clientHeading">Edificios</h1>

        <div class="card">
          <button id="clearRecordsBtn" class="danger dangerTop">Eliminar registros de este cliente</button>

          <div class="stats">
            <div><strong id="totalCount">0</strong><span>Total</span></div>
            <div><strong id="seenCount">0</strong><span>Vistos</span></div>
            <div><strong id="pendingCount">0</strong><span>Pendientes</span></div>
          </div>

          <button id="openListBtn" class="primary">▦ Ver registros en tabla</button>
          <button id="importExcelBtn" class="secondary">Importar Excel</button>
          <input id="importExcelInput" class="hidden" type="file" accept=".xlsx,.xls" />
          <p id="importStatus" class="importStatus"></p>
          <button id="newRecordBtn" class="secondary">Meter dato nuevo</button>
          <button id="downloadExcelBtn" class="secondary">Descargar Excel</button>
        </div>
      </section>

      <section id="listView" class="hidden">
        <button class="back" data-back="home">← Volver</button>
        <p class="kicker">REGISTROS</p>
        <h2>Listado</h2>

        <div class="compactFilters">
          <label>Edificio<input id="filterEdificio" type="search" placeholder="Filtrar edificio o ubicación" /></label>
          <label>Defectos<input id="filterNumero" type="search" placeholder="Filtrar defectos" /></label>
          <label>Recordar<input id="filterSerie" type="search" placeholder="Filtrar recordar" /></label>
          <label>Ordenar
            <select id="sortOrder">
              <option value="none">Sin ordenar</option>
              <option value="edificio">Edificio</option>
              <option value="numero">Defectos</option>
            </select>
          </label>
          <label>Estado<select id="seenFilter"><option value="all">Todos</option><option value="pending">Pendientes</option><option value="seen">Vistos</option></select></label>
        </div>

        <div class="listActions">
          <button id="newRecordFromListBtn" class="secondary">Meter dato nuevo</button>
          <button id="downloadExcelFromTableBtn" class="secondary">⇩ Descargar todos en Excel</button>
        </div>

        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Edificio</th>
                <th>Visto</th>
                <th>Ubicación</th>
                <th>Defectos</th>
                <th>Recordar</th>
                <th>Información</th>
                <th>Observaciones</th>
                <th>DET</th>
                <th>CEX</th>
                <th>RXT</th>
                <th>GRU</th>
                <th>RED</th>
                <th>MON</th>
                <th>Foto 1</th>
                <th>Foto 2</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="recordsBody"></tbody>
          </table>
        </div>
      </section>

      <section id="formView" class="hidden">
        <div class="formTopLine">
          <button class="back" data-back="list">← Volver</button>
        </div>
        <p class="kicker" id="formKicker">REGISTRO</p>
        <h2 id="formTitle">Editar registro</h2>

        <form id="recordForm" class="card formCard">
          <input type="hidden" id="recordId" />

          <label>Edificio<input id="edificio" /></label>
          <label>Ubicación<textarea id="ubicacion" rows="2"></textarea></label>
          <label>Defectos<textarea id="cantidad" rows="3"></textarea></label>
          <label>Recordar<textarea id="numeroSerie" rows="3"></textarea></label>
          <label>Información<textarea id="fechaFabricacion" rows="3"></textarea></label>
          <label>Observaciones<textarea id="observaciones" rows="3"></textarea></label>
          <label class="seenLine"><input id="visto" type="checkbox" /><span>Marcar como visto</span></label>
          <div class="statusGrid">
            <div><span>DET</span><button type="button" id="det" class="statusButton statusNo" aria-pressed="false">No</button></div>
            <div><span>CEX</span><button type="button" id="cex" class="statusButton statusNo" aria-pressed="false">No</button></div>
            <div><span>RXT</span><button type="button" id="rxt" class="statusButton statusNo" aria-pressed="false">No</button></div>
            <div><span>GRU</span><button type="button" id="gru" class="statusButton statusNo" aria-pressed="false">No</button></div>
            <div><span>RED</span><button type="button" id="red" class="statusButton statusNo" aria-pressed="false">No</button></div>
            <div><span>MON</span><button type="button" id="mon" class="statusButton statusNo" aria-pressed="false">No</button></div>
          </div>

          <div class="photosBlock">
            <h3>Fotografías</h3>
            <div class="photoGrid">
              <div class="photoSlot">
                <strong>Foto 1</strong>
                <label class="photoBox" id="photoBox1">
                  <input id="photoInput1" type="file" accept="image/*" capture="environment" />
                  <span>+ Hacer foto</span>
                  <img id="photoPreview1" alt="Foto 1" class="hidden" />
                </label>
                <button type="button" id="deletePhoto1" class="photoDelete">Eliminar foto</button>
              </div>
              <div class="photoSlot">
                <strong>Foto 2</strong>
                <label class="photoBox" id="photoBox2">
                  <input id="photoInput2" type="file" accept="image/*" capture="environment" />
                  <span>+ Hacer foto</span>
                  <img id="photoPreview2" alt="Foto 2" class="hidden" />
                </label>
                <button type="button" id="deletePhoto2" class="photoDelete">Eliminar foto</button>
              </div>
            </div>
          </div>

          <div class="actions">
            <button type="button" id="viewTableFromFormBtn" class="secondary">▦ Ver registros en tabla</button>
            <button type="submit" class="primary">Guardar</button>
            <button type="button" id="deleteBtn" class="danger">Eliminar</button>
          </div>
        </form>
      </section>
    </main>

    <script src="exceljs.min.js"></script>
    <script src="seed-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
