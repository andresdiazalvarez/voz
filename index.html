<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff4fb8" />
    <title>VOZ</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icon.svg" alt="" />
        <span>VOZ</span>
      </div>
    </header>

    <main>
      <section id="homeView" class="hero">
        <p class="kicker">VOZ</p>
        <h1>VOZ</h1>

        <div class="card">
          <button id="clearRecordsBtn" class="danger dangerTop">Eliminar todos los registros</button>

          <div class="stats">
            <div><strong id="totalCount">0</strong><span>Total</span></div>
            <div><strong id="seenCount">0</strong><span>Vistos</span></div>
            <div><strong id="pendingCount">0</strong><span>Pendientes</span></div>
          </div>

          <button id="openListBtn" class="primary">▦ Ver registros en tabla</button>
          <button id="importExcelBtn" class="secondary">Importar Excel</button>
          <input id="importExcelInput" class="hidden" type="file" accept=".xlsx,.xls" />
          <p id="importStatus" class="importStatus"></p>
          <button id="newRecordBtn" class="secondary">Meter dato nuevo</button>
          <button id="downloadExcelBtn" class="secondary">Descargar Excel</button>
        </div>
      </section>

      <section id="listView" class="hidden">
        <button class="back" data-back="home">← Volver</button>
        <p class="kicker">REGISTROS</p>
        <h2>Listado</h2>

        <div class="compactFilters">
          <label>Edificio<input id="filterEdificio" type="search" placeholder="Filtrar edificio o ubicación" /></label>
          <label>Defectos<input id="filterNumero" type="search" placeholder="Filtrar defectos" /></label>
          <label>Recordar<input id="filterSerie" type="search" placeholder="Filtrar recordar" /></label>
          <label>Ordenar
            <select id="sortOrder">
              <option value="none">Sin ordenar</option>
              <option value="edificio">Edificio</option>
              <option value="numero">Defectos</option>
            </select>
          </label>
          <label>Estado<select id="seenFilter"><option value="all">Todos</option><option value="pending">Pendientes</option><option value="seen">Vistos</option></select></label>
        </div>

        <div class="listActions">
          <button id="newRecordFromListBtn" class="secondary">Meter dato nuevo</button>
          <button id="downloadExcelFromTableBtn" class="secondary">⇩ Descargar todos en Excel</button>
        </div>

        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Edificio</th>
                <th>Visto</th>
                <th>Ubicación</th>
                <th>Defectos</th>
                <th>Recordar</th>
                <th>Información</th>
                <th>Observaciones</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="recordsBody"></tbody>
          </table>
        </div>
      </section>

      <section id="formView" class="hidden">
        <div class="formTopLine">
          <button class="back" data-back="list">← Volver</button>
        </div>
        <p class="kicker" id="formKicker">REGISTRO</p>
        <h2 id="formTitle">Editar registro</h2>

        <form id="recordForm" class="card formCard">
          <input type="hidden" id="recordId" />

          <div class="voiceBlock">
            <div>
              <h3>Entrada por voz</h3>
              <p id="voiceStatus">Voz parada.</p>
            </div>
            <div class="voiceActions">
              <button type="button" id="voiceStartBtn" class="secondary">Iniciar voz</button>
              <button type="button" id="voiceStopBtn" class="secondary" disabled>Parar voz</button>
            </div>
          </div>

          <label>Edificio<input id="edificio" /></label>
          <label>Ubicación<textarea id="ubicacion" rows="2"></textarea></label>
          <label>Defectos<textarea id="cantidad" rows="3"></textarea></label>
          <label>Recordar<textarea id="numeroSerie" rows="3"></textarea></label>
          <label>Información<textarea id="fechaFabricacion" rows="3"></textarea></label>
          <label>Observaciones<textarea id="observaciones" rows="3"></textarea></label>
          <label class="seenLine"><input id="visto" type="checkbox" /><span>Marcar como visto</span></label>

          <div class="actions">
            <button type="button" id="viewTableFromFormBtn" class="secondary">▦ Ver registros en tabla</button>
            <button type="submit" class="primary">Guardar</button>
            <button type="button" id="deleteBtn" class="danger">Eliminar</button>
          </div>
        </form>
      </section>
    </main>

    <script src="exceljs.min.js"></script>
    <script src="seed-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
